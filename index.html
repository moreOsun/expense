                            this.renderCategoryManageList();
                        });
                    } else {
                        // 普通态：图标+名称 + 编辑/删除
                        item.innerHTML = `
                            <span class="category-icon">${cat.icon}</span>
                            <span class="category-manage-name">${cat.name}</span>
                            <button type="button" class="btn-edit">编辑</button>
                            <button type="button" class="btn-delete">删除</button>
                        `;
                        item.querySelector('.btn-edit').addEventListener('click', () => {
                            if (Date.now() - this.categoryModalOpenedAt < 350) return;
                            this.editingCategoryIndex = index;
                            this.renderCategoryManageList();
                        });
                        item.querySelector('.btn-delete').addEventListener('click', () => {
                            if (Date.now() - this.categoryModalOpenedAt < 350) return;
                            this.deleteCategory(index);
                        });
                    }

                    container.appendChild(item);
                });
            }

            // 新增栏目（当前页签）
            addCategory() {
                const iconInput = document.getElementById('newCategoryIcon');
                const nameInput = document.getElementById('newCategoryName');
                const icon = iconInput.value.trim() || '📋';
                const name = nameInput.value.trim();

                if (!name) {
                    this.showToast('请输入栏目名称');
                    return;
                }

                if (this.currentCatList().some(cat => cat.name === name)) {
                    this.showToast('栏目已存在');
                    return;
                }

                this.currentCatList().push({ name: name, icon: icon });
                this.saveCategories(this.catModalType);
                this.updateCategoryOptions();
                this.renderCategoryManageList();
                iconInput.value = '';
                nameInput.value = '';
                this.showToast('新增栏目成功');
            }

            // 保存栏目编辑（重命名时同步更新历史记录）
            async saveCategoryEdit(index, newName, newIcon) {
                if (!newName) {
                    this.showToast('栏目名称不能为空');
                    return;
                }

                const list = this.currentCatList();
                const type = this.catModalType;
                const oldName = list[index].name;

                if (newName !== oldName && list.some((cat, i) => i !== index && cat.name === newName)) {
                    this.showToast('栏目已存在');
                    return;
                }

                list[index] = { name: newName, icon: newIcon || '📋' };
                this.saveCategories(type);

                // 重命名时同步更新历史记录中的栏目名
                if (newName !== oldName) {
                    const records = await this.storage.getRecords();
                    const affected = records.filter(r => r.type === type && r.category === oldName);
                    for (const record of affected) {
                        await this.storage.updateRecord(record.id, { category: newName });
                    }
                    if (affected.length > 0) {
                        await this.renderRecords();
                    }
                }

                this.editingCategoryIndex = null;
                this.updateCategoryOptions();
                this.renderCategoryManageList();
                this.showToast('修改成功');
            }

            // 删除栏目（当前页签）
            deleteCategory(index) {
                const label = this.catModalType === 'income' ? '收入' : '支出';
                if (this.currentCatList().length <= 1) {
                    this.showToast(`至少保留一个${label}栏目`);
                    return;
                }

                const cat = this.currentCatList()[index];
                if (!confirm(`确定删除${label}栏目“${cat.name}”吗？\n已有记录仍会保留该栏目名。`)) {
                    return;
                }

                this.currentCatList().splice(index, 1);
                this.saveCategories(this.catModalType);
                this.editingCategoryIndex = null;
                this.updateCategoryOptions();
                this.renderCategoryManageList();
                this.showToast('删除成功');
            }

            // 设置分类选项
            setupCategories() {
                this.updateCategoryOptions();
            }

            updateCategoryOptions() {
                const select = document.getElementById('category');
                select.innerHTML = '<option value="">请选择分类</option>';
                
                this.categories[this.currentType].forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = `${cat.icon} ${cat.name}`;
                    select.appendChild(option);
                });
            }

            // 更新编辑表单分类选项
            updateEditCategoryOptions(type) {
                const select = document.getElementById('editCategory');
                select.innerHTML = '<option value="">请选择分类</option>';
                
                this.categories[type].forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = `${cat.icon} ${cat.name}`;
                    select.appendChild(option);
                });
            }

            // 设置默认日期（本地今天，自绘控件显示同步）
            setDefaultDate() {
                this.setDateField('date', this.fmtLocal(new Date()));
            }

            // ===== 自绘日历日期选择器（原生 input[type=date] 在老移动 WebView 上渲染不可靠）=====
            fmtLocal(d) {
                const p = n => (n < 10 ? '0' + n : '' + n);
                return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
            }

            // 写入隐藏域并刷新触发按钮文案（val 形如 2026-10-13）
            setDateField(id, val) {
                document.getElementById(id).value = val || '';
                const textEl = document.getElementById(id === 'date' ? 'dateText' : 'editDateText');
                if (!val) { textEl.textContent = '请选择日期'; return; }
                const d = new Date(val + 'T00:00:00');
                textEl.textContent = val + ' 周' + '日一二三四五六'[d.getDay()];
            }

            openDatePicker(targetId) {
                this.dpTarget = targetId;
                const val = document.getElementById(targetId).value;
                const d = val ? new Date(val + 'T00:00:00') : new Date();
                const base = isNaN(d.getTime()) ? new Date() : d;
                this.dpY = base.getFullYear();
                this.dpM = base.getMonth();
                this.renderDatePicker();
                document.getElementById('datePickerModal').classList.add('show');
            }

            closeDatePicker() {
                document.getElementById('datePickerModal').classList.remove('show');
            }

            dpShiftMonth(delta) {
                this.dpM += delta;
                if (this.dpM < 0) { this.dpM = 11; this.dpY--; }
                if (this.dpM > 11) { this.dpM = 0; this.dpY++; }
                this.renderDatePicker();
            }

            renderDatePicker() {
                document.getElementById('dpTitle').textContent = this.dpY + '年' + (this.dpM + 1) + '月';
                const firstDay = new Date(this.dpY, this.dpM, 1).getDay();
                const daysInMonth = new Date(this.dpY, this.dpM + 1, 0).getDate();
                const sel = document.getElementById(this.dpTarget).value;
                const todayStr = this.fmtLocal(new Date());
                const p = n => (n < 10 ? '0' + n : '' + n);
                let html = '';
                for (let i = 0; i < firstDay; i++) html += '<button type="button" class="dp-cell dp-empty"></button>';
                for (let day = 1; day <= daysInMonth; day++) {
                    const v = this.dpY + '-' + p(this.dpM + 1) + '-' + p(day);
                    let cls = 'dp-cell';
                    if (v === todayStr) cls += ' dp-today';
                    if (v === sel) cls += ' dp-selected';
                    html += '<button type="button" class="' + cls + '" data-day="' + day + '">' + day + '</button>';
                }
                document.getElementById('dpGrid').innerHTML = html;
            }

            dpPickDay(day) {
                const p = n => (n < 10 ? '0' + n : '' + n);
                const v = this.dpY + '-' + p(this.dpM + 1) + '-' + p(day);
                this.setDateField(this.dpTarget, v);
                this.closeDatePicker();
            }

            // 切换标签页
            switchTab(btn) {
                const tabName = btn.dataset.tab;
                
                // 更新按钮状态
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 更新内容显示
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(`${tabName}-tab`).classList.add('active');

                // 如果切换到统计页，更新统计数据
                if (tabName === 'stats') {
                    this.updateStats();
                } else if (tabName === 'chart') {
                    // 切换到图表页，渲染图表
                    this.renderChart();
                }
            }

            // 切换收支类型
            switchType(btn) {
                const type = btn.dataset.type;
                this.currentType = type;

                // 更新按钮状态
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 更新分类选项
                this.updateCategoryOptions();
            }

            // 切换编辑表单类型
            switchEditType(btn) {
                const type = btn.dataset.type;

                // 更新按钮状态
                document.querySelectorAll('.type-btn-edit').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 更新编辑表单分类选项
                this.updateEditCategoryOptions(type);
            }

            // 切换统计维度
            switchStatsPeriod(btn) {
                const period = btn.dataset.period;
                this.currentPeriod = period;

                // 更新按钮状态
                document.querySelectorAll('.stats-tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 切换视图
                if (period === 'calendar') {
                    document.getElementById('normalStatsView').style.display = 'none';
                    document.getElementById('calendarView').style.display = 'block';
                    this.renderCalendar();
                } else {
                    document.getElementById('normalStatsView').style.display = 'block';
                    document.getElementById('calendarView').style.display = 'none';
                    this.updateStats();
                }
            }

            // 添加记录
            async addRecord() {
                const amount = parseFloat(document.getElementById('amount').value);
                const category = document.getElementById('category').value;
                const note = document.getElementById('note').value;
                const date = document.getElementById('date').value;

                if (!category) {
                    this.showToast('请选择分类');
                    return;
                }

                const record = {
                    type: this.currentType,
                    amount: amount,
                    category: category,
                    note: note,
                    date: date
                };

                await this.storage.addRecord(record);
                await this.updateSummary();
                await this.renderRecords();
                this.resetForm();
                this.showToast('添加成功');
            }

            // 重置表单
            resetForm() {
                document.getElementById('recordForm').reset();
                this.setDefaultDate();
            }

            // 删除记录
            async deleteRecord(id) {
                if (confirm('确定要删除这条记录吗？')) {
                    await this.storage.deleteRecord(id);
                    await this.updateSummary();
                    await this.renderRecords();
                    this.showToast('删除成功');
                }
            }

            // 清空所有记录
            async clearAll() {
                if (confirm('确定要清空所有记录吗？此操作不可恢复！')) {
                    await this.storage.clearAll();
                    await this.updateSummary();
                    await this.renderRecords();
                    this.showToast('已清空所有记录');
                }
            }

            // 更新汇总信息
            async updateSummary() {
                const records = await this.storage.getRecords();
                let totalIncome = 0;
                let totalExpense = 0;

                records.forEach(record => {
                    if (record.type === 'income') {
                        totalIncome += record.amount;
                    } else {
                        totalExpense += record.amount;
                    }
                });

                const balance = totalIncome - totalExpense;

                document.getElementById('totalIncome').textContent = `¥${totalIncome.toFixed(2)}`;
                document.getElementById('totalExpense').textContent = `¥${totalExpense.toFixed(2)}`;
                document.getElementById('balance').textContent = `¥${balance.toFixed(2)}`;
            }

            // 渲染记录列表
            async renderRecords(filter = 'all') {
                const records = await this.storage.getRecords();
                const container = document.getElementById('recordList');
                
                const filteredRecords = filter === 'all' 
                    ? records 
                    : records.filter(r => r.type === filter);

                if (filteredRecords.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <div>暂无记录</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                filteredRecords.forEach(record => {
                    const recordDiv = document.createElement('div');
                    recordDiv.className = `record-item ${record.type}`;
                    
                    // 获取分类图标
                    const categoryIcon = this.getCategoryIcon(record.category, record.type);
                    
                    recordDiv.innerHTML = `
                        <div class="record-info">
                            <div class="record-category">
                                <span class="category-icon">${categoryIcon}</span>
                                <span>${record.category}</span>
                            </div>
                            ${record.note ? `<div class="record-note">${record.note}</div>` : ''}
                            <div class="record-date">${record.date}</div>
                        </div>
                        <div class="record-amount ${record.type}">
                            ${record.type === 'income' ? '+' : '-'}¥${record.amount.toFixed(2)}
                        </div>
                        <div class="record-actions">
                            <button class="btn-edit">编辑</button>
                            <button class="btn-delete">删除</button>
                        </div>
                    `;
                    
                    // 添加事件监听器
                    const editBtn = recordDiv.querySelector('.btn-edit');
                    const deleteBtn = recordDiv.querySelector('.btn-delete');
                    
                    editBtn.addEventListener('click', () => this.openEditModal(record.id));
                    deleteBtn.addEventListener('click', () => this.deleteRecord(record.id));
                    
                    container.appendChild(recordDiv);
                });
            }

            // 获取分类图标
            getCategoryIcon(categoryName, type) {
                const categories = this.categories[type];
                const category = categories.find(cat => cat.name === categoryName);
                return category ? category.icon : '📋';
            }

            // 打开编辑模态框
            async openEditModal(id) {
                const records = await this.storage.getRecords();
                const record = records.find(r => r.id === id);
                
                if (!record) return;

                this.editingRecordId = id;

                // 填充表单数据
                document.getElementById('editRecordId').value = id;
                document.getElementById('editAmount').value = record.amount;
                document.getElementById('editNote').value = record.note || '';
                this.setDateField('editDate', record.date);

                // 设置类型按钮状态
                document.querySelectorAll('.type-btn-edit').forEach(btn => {
                    if (btn.dataset.type === record.type) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                // 更新分类选项并选中当前分类
                this.updateEditCategoryOptions(record.type);
                document.getElementById('editCategory').value = record.category;

                // 显示模态框
                document.getElementById('editModal').classList.add('show');
            }

            // 关闭编辑模态框
            closeEditModal() {
                document.getElementById('editModal').classList.remove('show');
                document.getElementById('editForm').reset();
                this.editingRecordId = null;
            }

            // 保存编辑
            async saveEdit() {
                const id = document.getElementById('editRecordId').value;
                const amount = parseFloat(document.getElementById('editAmount').value);
                const category = document.getElementById('editCategory').value;
                const note = document.getElementById('editNote').value;
                const date = document.getElementById('editDate').value;

                if (!category) {
                    this.showToast('请选择分类');
                    return;
                }

                // 获取选中的类型
                const activeTypeBtn = document.querySelector('.type-btn-edit.active');
                const type = activeTypeBtn ? activeTypeBtn.dataset.type : 'expense';

                const updatedData = {
                    type: type,
                    amount: amount,
                    category: category,
                    note: note,
                    date: date
                };

                await this.storage.updateRecord(id, updatedData);
                await this.updateSummary();
                await this.renderRecords();
                this.closeEditModal();
                this.showToast('修改成功');
            }

            // 更新统计信息
            async updateStats() {
                const records = await this.storage.getRecords();
                const now = new Date();
                let startDate, endDate, titleText, incomeLabel, expenseLabel, balanceLabel;

                // 根据不同维度设置时间范围
                switch (this.currentPeriod) {
                    case 'day':
                        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                        endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
                        titleText = '今日统计';
                        incomeLabel = '今日收入';
                        expenseLabel = '今日支出';
                        balanceLabel = '今日结余';
                        break;
                    case 'week':
                        const dayOfWeek = now.getDay() || 7; // 周日为0，转换为7
                        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1);
                        endDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 7, 23, 59, 59);
                        titleText = '本周统计';
                        incomeLabel = '本周收入';
                        expenseLabel = '本周支出';
                        balanceLabel = '本周结余';
                        break;
                    case 'month':
                        startDate = new Date(now.getFullYear(), now.getMonth(), 1);
                        endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
                        titleText = '本月统计';
                        incomeLabel = '本月收入';
                        expenseLabel = '本月支出';
                        balanceLabel = '本月结余';
                        break;
                    case 'year':
                        startDate = new Date(now.getFullYear(), 0, 1);
                        endDate = new Date(now.getFullYear(), 11, 31, 23, 59, 59);
                        titleText = '本年统计';
                        incomeLabel = '本年收入';
                        expenseLabel = '本年支出';
                        balanceLabel = '本年结余';
                        break;
                }

                // 筛选时间范围内的记录
                const periodRecords = records.filter(record => {
                    const recordDate = new Date(record.date);
                    return recordDate >= startDate && recordDate <= endDate;
                });

                let periodIncome = 0;
                let periodExpense = 0;
                const categoryStats = {};

                periodRecords.forEach(record => {
                    if (record.type === 'income') {
                        periodIncome += record.amount;
                    } else {
                        periodExpense += record.amount;
                        if (!categoryStats[record.category]) {
                            categoryStats[record.category] = 0;
                        }
                        categoryStats[record.category] += record.amount;
                    }
                });

                const periodBalance = periodIncome - periodExpense;

                // 更新标题和标签
                document.getElementById('statsTitle').textContent = titleText;
                document.getElementById('periodIncomeLabel').textContent = incomeLabel;
                document.getElementById('periodExpenseLabel').textContent = expenseLabel;
                document.getElementById('periodBalanceLabel').textContent = balanceLabel;

                // 更新数值
                document.getElementById('periodIncome').textContent = `¥${periodIncome.toFixed(2)}`;
                document.getElementById('periodExpense').textContent = `¥${periodExpense.toFixed(2)}`;
                document.getElementById('periodBalance').textContent = `¥${periodBalance.toFixed(2)}`;

                // 渲染分类统计
                this.renderCategoryStats(categoryStats, periodExpense);
            }

            // 渲染分类统计
            renderCategoryStats(stats, total) {
                const container = document.getElementById('categoryStats');
                
                if (Object.keys(stats).length === 0) {
                    container.innerHTML = '<div class="empty-state">本月暂无支出记录</div>';
                    return;
                }

                const sortedStats = Object.entries(stats).sort((a, b) => b[1] - a[1]);

                container.innerHTML = `
                    <h4 style="margin-top: 20px; margin-bottom: 10px;">支出分类排行</h4>
                    ${sortedStats.map(([category, amount]) => {
                        const percentage = total > 0 ? (amount / total * 100).toFixed(1) : 0;
                        const icon = this.getCategoryIcon(category, 'expense');
                        return `
                            <div class="category-item">
                                <div style="flex: 1;">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span class="category-name">
                                            <span class="category-icon">${icon}</span>
                                            ${category}
                                        </span>
                                        <span class="category-amount expense">¥${amount.toFixed(2)}</span>
                                    </div>
                                    <div class="category-bar" style="width: ${percentage}%;"></div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                `;
            }

            // 显示提示消息
            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            // 导出数据
            async exportData() {
                try {
                    const count = await this.storage.exportToFile();
                    this.showToast(`已导出 ${count} 条记录，请在“下载”中查看`);
                } catch (error) {
                    this.showToast('导出失败：' + error.message);
                }
            }

            // 导入数据（覆盖式恢复，含自定义栏目）
            async importData(file) {
                if (!file) return;

                if (!confirm('导入会覆盖当前全部记录和栏目，确定继续吗？')) {
                    document.getElementById('importFile').value = '';
                    return;
                }

                try {
                    const res = await this.storage.importFromFile(file);
                    if (res.categories) {
                        if (Array.isArray(res.categories.expense) && res.categories.expense.length > 0) {
                            this.categories.expense = res.categories.expense;
                            this.saveCategories('expense');
                        }
                        if (Array.isArray(res.categories.income) && res.categories.income.length > 0) {
                            this.categories.income = res.categories.income;
                            this.saveCategories('income');
                        }
                        this.updateCategoryOptions();
                    }
                    await this.updateSummary();
                    await this.renderRecords();
                    let msg = `成功导入 ${res.count} 条记录`;
                    if (res.skipped > 0) msg += `（跳过 ${res.skipped} 条无效）`;
                    this.showToast(msg);
                } catch (error) {
                    this.showToast('导入失败：' + error.message);
                } finally {
                    document.getElementById('importFile').value = '';
                }
            }

            // 切换日历月份
            changeCalendarMonth(offset) {
                this.calendarDate = new Date(this.calendarDate.getFullYear(), this.calendarDate.getMonth() + offset, 1);
                this.renderCalendar();
            }

            // 渲染日历
            async renderCalendar() {
                const year = this.calendarDate.getFullYear();
                const month = this.calendarDate.getMonth();
                
                // 更新标题
                document.getElementById('calendarTitle').textContent = `${year}年${month + 1}月`;
                
                // 获取记录
                const records = await this.storage.getRecords();
                
                // 计算每日数据
                const dailyData = this.calculateDailyData(records, year, month);
                
                // 计算月度汇总
                const monthStats = this.calculateMonthStats(dailyData);
                document.getElementById('calendarMonthIncome').textContent = `¥${monthStats.income.toFixed(2)}`;
                document.getElementById('calendarMonthExpense').textContent = `¥${monthStats.expense.toFixed(2)}`;
                document.getElementById('calendarMonthBalance').textContent = `¥${monthStats.balance.toFixed(2)}`;
                
                // 渲染日历表格
                this.renderCalendarDays(year, month, dailyData);
            }

            // 计算每日数据
            calculateDailyData(records, year, month) {
                const dailyData = {};
                
                records.forEach(record => {
                    const recordDate = new Date(record.date);
                    if (recordDate.getFullYear() === year && recordDate.getMonth() === month) {
                        const day = recordDate.getDate();
                        if (!dailyData[day]) {
                            dailyData[day] = { income: 0, expense: 0 };
                        }
                        if (record.type === 'income') {
                            dailyData[day].income += record.amount;
                        } else {
                            dailyData[day].expense += record.amount;
                        }
                    }
                });
                
                return dailyData;
            }

            // 计算月度统计
            calculateMonthStats(dailyData) {
                let income = 0;
                let expense = 0;
                
                Object.values(dailyData).forEach(data => {
                    income += data.income;
                    expense += data.expense;
                });
                
                return {
                    income: income,
                    expense: expense,
                    balance: income - expense
                };
            }

            // 渲染日历日期
            renderCalendarDays(year, month, dailyData) {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const today = new Date();
                const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
                
                const container = document.getElementById('calendarDays');
                container.innerHTML = '';
                
                // 添加空白日期（月份开始前的空格）
                for (let i = 0; i < firstDay; i++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'calendar-day empty';
                    container.appendChild(emptyDay);
                }
                
                // 添加每一天
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'calendar-day';
                    
                    // 判断是否为周末（0=周日, 6=周六）
                    const dayOfWeek = new Date(year, month, day).getDay();
                    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                    
                    if (isWeekend) {
                        dayDiv.classList.add('weekend');
                    }
                    
                    const data = dailyData[day];
                    if (data && (data.income > 0 || data.expense > 0)) {
                        dayDiv.classList.add('has-data');
                    }
                    
                    if (isCurrentMonth && today.getDate() === day) {
                        dayDiv.classList.add('today');
                    }
                    
                    // 日期数字
                    const dayNumber = document.createElement('div');
                    dayNumber.className = 'calendar-day-number';
                    dayNumber.textContent = day;
                    dayDiv.appendChild(dayNumber);
                    
                    // 显示收入和支出
                    if (data) {
                        // 只显示当日结余
                        const balance = data.income - data.expense;
                        const balanceDiv = document.createElement('div');
                        balanceDiv.className = `calendar-day-balance ${balance > 0 ? 'positive' : balance < 0 ? 'negative' : 'zero'}`;
                        balanceDiv.textContent = balance > 0 ? `+¥${balance.toFixed(0)}` : balance < 0 ? `¥${balance.toFixed(0)}` : '¥0';
                        dayDiv.appendChild(balanceDiv);
                    }
                    
                    // 点击事件 - 只有有数据时才显示明细
                    if (data) {
                        dayDiv.addEventListener('click', () => {
                            this.showDayDetailModal(year, month, day, data);
                        });
                    }
                    
                    container.appendChild(dayDiv);
                }
            }

            // 显示某日明细模态框
            async showDayDetailModal(year, month, day, data) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                // 设置标题
                document.getElementById('dayDetailTitle').textContent = `${year}年${month + 1}月${day}日`;
                
                // 设置汇总
                document.getElementById('detailIncome').textContent = `¥${data.income.toFixed(2)}`;
                document.getElementById('detailExpense').textContent = `¥${data.expense.toFixed(2)}`;
                const balance = data.income - data.expense;
                const balanceEl = document.getElementById('detailBalance');
                balanceEl.textContent = `¥${balance.toFixed(2)}`;
                balanceEl.style.color = balance >= 0 ? 'var(--income-color)' : 'var(--expense-color)';
                
                // 获取当日所有记录
                const records = await this.storage.getRecords();
                const dayRecords = records.filter(record => record.date === dateStr);
                
                // 渲染记录列表
                const listContainer = document.getElementById('dayDetailList');
                if (dayRecords.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state">暂无记录</div>';
                } else {
                    listContainer.innerHTML = dayRecords.map(record => {
                        const icon = this.getCategoryIcon(record.category, record.type);
                        return `
                        <div class="detail-record-item ${record.type}">
                            <div class="detail-record-info">
                                <div class="detail-record-category">
                                    <span class="category-icon">${icon}</span>
                                    ${record.category}
                                </div>
                                ${record.note ? `<div class="detail-record-note">${record.note}</div>` : ''}
                            </div>
                            <div class="detail-record-amount ${record.type}">
                                ${record.type === 'income' ? '+' : '-'}¥${record.amount.toFixed(2)}
                            </div>
                        </div>
                    `;
                    }).join('');
                }
                
                // 显示模态框
                document.getElementById('dayDetailModal').classList.add('show');
            }

            // 关闭日历明细模态框
            closeDayDetailModal() {
                document.getElementById('dayDetailModal').classList.remove('show');
            }

            // 显示某日详情（原有简单提示）
            showDayDetails(year, month, day, data) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const message = `${year}年${month + 1}月${day}日\n收入：¥${data.income.toFixed(2)}\n支出：¥${data.expense.toFixed(2)}\n结余：¥${(data.income - data.expense).toFixed(2)}`;
                this.showToast(message);
            }

            // 图表功能
            // 切换图表维度
            switchChartPeriod(btn) {
                const period = btn.dataset.period;
                this.chartPeriod = period;
                
                document.querySelectorAll('.chart-tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                this.renderChart();
            }

            // 渲染图表
            async renderChart() {
                const records = await this.storage.getRecords();
                let chartData = [];
                let title = '';
                
                switch (this.chartPeriod) {
                    case 'day':
                        chartData = this.getChartDataByDay(records);
                        title = '近7天余额走势';
                        break;
                    case 'month':
                        chartData = this.getChartDataByMonth(records);
                        title = '近12个月余额走势';
                        break;
                    case 'year':
                        chartData = this.getChartDataByYear(records);
                        title = '近5年余额走势';
                        break;
                }
                
                document.getElementById('chartTitle').textContent = title;
                this.drawChart(chartData);
                this.updateChartStats(chartData);
            }

            // 获取按日统计的图表数据（近7天）
            getChartDataByDay(records) {
                const data = [];
                const today = new Date();
                
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    const dateStr = date.toISOString().split('T')[0];
                    
                    const dayRecords = records.filter(r => r.date === dateStr);
                    const income = dayRecords.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0);
                    const expense = dayRecords.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
                    const balance = income - expense;
                    
                    data.push({
                        label: `${date.getMonth() + 1}/${date.getDate()}`,
                        balance: balance,
                        income: income,
                        expense: expense
                    });
                }
                
                return data;
            }

            // 获取按月统计的图表数据（近12个月）
            getChartDataByMonth(records) {
                const data = [];
                const today = new Date();
                
                for (let i = 11; i >= 0; i--) {
                    const date = new Date(today.getFullYear(), today.getMonth() - i, 1);
                    const year = date.getFullYear();
                    const month = date.getMonth();
                    
                    const monthRecords = records.filter(r => {
                        const recordDate = new Date(r.date);
                        return recordDate.getFullYear() === year && recordDate.getMonth() === month;
                    });
                    
                    const income = monthRecords.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0);
                    const expense = monthRecords.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
                    const balance = income - expense;
                    
                    data.push({
                        label: `${month + 1}月`,
                        balance: balance,
                        income: income,
                        expense: expense
                    });
                }
                
                return data;
            }

            // 获取按年统计的图表数据（近5年）
            getChartDataByYear(records) {
                const data = [];
                const currentYear = new Date().getFullYear();
                
                for (let i = 4; i >= 0; i--) {
                    const year = currentYear - i;
                    
                    const yearRecords = records.filter(r => {
                        const recordDate = new Date(r.date);
                        return recordDate.getFullYear() === year;
                    });
                    
                    const income = yearRecords.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0);
                    const expense = yearRecords.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
                    const balance = income - expense;
                    
                    data.push({
                        label: `${year}年`,
                        balance: balance,
                        income: income,
                        expense: expense
                    });
                }
                
                return data;
            }

            // 更新图表统计信息
            updateChartStats(chartData) {
                const balances = chartData.map(d => d.balance);
                const max = Math.max(...balances);
                const min = Math.min(...balances);
                const avg = balances.reduce((sum, b) => sum + b, 0) / balances.length;
                
                document.getElementById('chartMax').textContent = `¥${max.toFixed(0)}`;
                document.getElementById('chartMin').textContent = `¥${min.toFixed(0)}`;
                document.getElementById('chartAvg').textContent = `¥${avg.toFixed(0)}`;
                
                // 设置颜色
                document.getElementById('chartAvg').style.color = avg >= 0 ? 'var(--income-color)' : 'var(--expense-color)';
            }

            // 绘制图表
            drawChart(data) {
                const canvas = document.getElementById('balanceChart');
                const ctx = canvas.getContext('2d');
                
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (data.length === 0) {
                    ctx.font = '16px Arial';
                    ctx.fillStyle = '#999';
                    ctx.textAlign = 'center';
                    ctx.fillText('暂无数据', canvas.width / 2, canvas.height / 2);
                    return;
                }
                
                const padding = 50;
                const chartWidth = canvas.width - padding * 2;
                const chartHeight = canvas.height - padding * 2;
                
                // 计算数据范围
                const balances = data.map(d => d.balance);
                const maxBalance = Math.max(...balances, 0);
                const minBalance = Math.min(...balances, 0);
                const range = maxBalance - minBalance;
                const buffer = range * 0.1; // 10%的上下留白
                
                // 绘制背景网格
                ctx.strokeStyle = '#e0e0e0';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 5; i++) {
                    const y = padding + (chartHeight / 5) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding, y);
                    ctx.lineTo(canvas.width - padding, y);
                    ctx.stroke();
                }
                
                // 绘制零轴线
                if (minBalance < 0 && maxBalance > 0) {
                    const zeroY = padding + chartHeight - ((0 - minBalance - buffer) / (range + buffer * 2)) * chartHeight;
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(padding, zeroY);
                    ctx.lineTo(canvas.width - padding, zeroY);
                    ctx.stroke();
                }
                
                // 绘制数据点和线
                const stepX = chartWidth / (data.length - 1);
                
                ctx.strokeStyle = '#4CAF50';
                ctx.lineWidth = 3;
                ctx.beginPath();
                
                data.forEach((point, index) => {
                    const x = padding + stepX * index;
                    const normalizedValue = (point.balance - minBalance + buffer) / (range + buffer * 2);
                    const y = padding + chartHeight - normalizedValue * chartHeight;
                    
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                
                ctx.stroke();
                
                // 绘制数据点
                data.forEach((point, index) => {
                    const x = padding + stepX * index;
                    const normalizedValue = (point.balance - minBalance + buffer) / (range + buffer * 2);
                    const y = padding + chartHeight - normalizedValue * chartHeight;
                    
                    // 绘制圆点
                    ctx.fillStyle = point.balance >= 0 ? '#4CAF50' : '#f44336';
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 绘制数值
                    ctx.fillStyle = '#333';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(`¥${point.balance.toFixed(0)}`, x, y - 12);
                    
                    // 绘制标签
                    ctx.fillStyle = '#666';
                    ctx.font = '11px Arial';
                    ctx.textAlign = 'center';
                    ctx.save();
                    ctx.translate(x, canvas.height - padding + 15);
                    ctx.rotate(-Math.PI / 4);
                    ctx.fillText(point.label, 0, 0);
                    ctx.restore();
                });
                
                // 绘制Y轴刻度
                ctx.fillStyle = '#666';
                ctx.font = '11px Arial';
                ctx.textAlign = 'right';
                for (let i = 0; i <= 5; i++) {
                    const value = maxBalance + buffer - ((range + buffer * 2) / 5) * i;
                    const y = padding + (chartHeight / 5) * i;
                    ctx.fillText(`¥${value.toFixed(0)}`, padding - 10, y + 4);
                }
            }
        }

        // 初始化应用
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new ExpenseApp();
        });
    </script>
</body>
